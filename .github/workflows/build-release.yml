name: Build and Release Nusamba NodeCore

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 3.0.0)'
        required: true
        default: '3.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Windows Agents (x64 / ARM64)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX Toolset
        run: dotnet tool install --global wix

      - name: Publish NusambaNode x64
        run: |
          dotnet publish PCSpecAgent/PCSpecAgent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Publish NusambaNode ARM64
        run: |
          dotnet publish PCSpecAgent/PCSpecAgent.csproj -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=true -o publish-arm64

      - name: Build WiX MSI Installers
        run: |
          wix build Package.wxs -o NusambaNodeCore-Setup.msi
          wix build Package.arm64.wxs -o NusambaNodeCore-Setup-arm64.msi

      - name: Create Zip Bundle
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath NusambaNodeCore-v3.0.0-win-x64.zip -Force

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NusambaNodeCore-Installers
          path: |
            NusambaNodeCore-Setup.msi
            NusambaNodeCore-Setup-arm64.msi
            NusambaNodeCore-v3.0.0-win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          name: "Nusamba NodeCore v${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '3.0.0') }}"
          tag_name: "${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v3.0.0') }}"
          draft: false
          prerelease: false
          body: |
            ## 🛡️ Nusamba NodeCore Endpoint & Remote Agent
            
            Rilis resmi pembaruan armada PC BPR Nusamba:
            - **NusambaNodeCore-Setup.msi**: Installer mesin 64-bit Intel / AMD.
            - **NusambaNodeCore-Setup-arm64.msi**: Installer mesin Windows ARM64 (Surface / Snapdragon).
            - **NusambaNodeCore-v3.0.0-win-x64.zip**: Portabel binaries standalone.
            
            ### Fitur Baru:
            1. **Rebranding Penuh**: Transformasi menyeluruh ke Nusamba NodeCore v3.0.0.
            2. **Bypass UAC Non-Admin**: Dukungan dual elevation via Task Scheduler & hak SYSTEM.
            3. **Bandwidth Optimization**: Unduhan payload langsung melalui Fastly / GitHub CDN.
          files: |
            NusambaNodeCore-Setup.msi
            NusambaNodeCore-Setup-arm64.msi
            NusambaNodeCore-v3.0.0-win-x64.zip
